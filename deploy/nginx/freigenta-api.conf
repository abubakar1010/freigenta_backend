# nginx site for the Freigenta API.
#
#   sudo cp deploy/nginx/freigenta-api.conf /etc/nginx/sites-available/freigenta-api
#   sudo ln -s /etc/nginx/sites-available/freigenta-api /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d api.freigenta.com     # fills in the TLS block below
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace api.freigenta.com throughout.

upstream freigenta_app {
    # Matches the loopback binding in docker-compose.prod.yml.
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.freigenta.com;

    # Certbot writes its challenge here; everything else goes to TLS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.freigenta.com;

    # ── TLS ──────────────────────────────────────────────────────────────────
    # certbot --nginx fills these in and manages renewal.
    ssl_certificate     /etc/letsencrypt/live/api.freigenta.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.freigenta.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # helmet already sets HSTS, CSP and friends on responses. Don't duplicate
    # them here — conflicting values are worse than one authoritative source.

    # 10 MB matches the fileSize limit in upload.middleware.ts. Keeping nginx
    # slightly above it lets the app return a clean 400 instead of nginx
    # returning an opaque 413.
    client_max_body_size 12m;

    access_log /var/log/nginx/freigenta-api.access.log;
    error_log  /var/log/nginx/freigenta-api.error.log;

    location / {
        proxy_pass http://freigenta_app;
        proxy_http_version 1.1;

        # Exactly one proxy hop. server.ts sets `trust proxy` to 1, so this is
        # the header it reads req.ip from — per-IP rate limiting depends on it.
        # Putting another proxy (e.g. Cloudflare) in front means raising that
        # value to 2, or every client collapses onto a single rate-limit key.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header Host              $host;

        # Socket.io: without these the websocket upgrade fails and clients
        # silently degrade to long-polling.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Webhook signatures are verified against the raw request body captured
        # in server.ts. Nothing in this path may rewrite it — do not add
        # body-modifying modules (sub_filter and the like) to this location.
        proxy_request_buffering on;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        # Long enough for Socket.io's idle connections not to be cut.
        proxy_read_timeout    300s;
    }

    # Health endpoint, unlogged to keep the access log readable.
    location = /health {
        proxy_pass http://freigenta_app;
        proxy_set_header Host $host;
        access_log off;
    }
}
